<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF7">
  <title>Дашборд — Журнал лаборатории</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body x-data="dashboard()" x-init="load()" x-cloak>
  <header class="appbar">
    <a href="dashboard.html" class="brand">Журнал лаборатории</a>
    <nav style="display:flex; gap:0.25rem;">
      <a href="sample.html" class="btn btn-ghost" style="padding:0 0.75rem;">Образцы</a>
      <a href="so2-calculator.html" class="btn btn-ghost" style="padding:0 0.75rem;">SO₂</a>
      <a href="settings.html" class="btn btn-ghost" style="padding:0 0.75rem;"><i data-lucide="settings"></i></a>
    </nav>
  </header>

  <main class="container">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; gap:0.5rem; flex-wrap:wrap;">
      <div>
        <h1 style="margin:0;">Дашборд</h1>
        <p style="color: var(--text-muted); margin: 0.25rem 0 0;" x-text="wineryName"></p>
      </div>
      <a href="new-analysis.html" class="btn btn-primary"><i data-lucide="plus"></i> Новый анализ</a>
    </div>

    <section style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1.5rem;">
      <template x-if="alerts.length === 0 && loaded">
        <div class="alert alert-green">Всё под контролем. Активных алертов нет.</div>
      </template>
      <template x-for="a in alerts" :key="a.sample.id + a.type">
        <a :href="'sample.html?id=' + a.sample.id" style="text-decoration:none;">
          <div :class="a.severity === 'red' ? 'alert alert-red' : 'alert alert-yellow'">
            <strong x-text="a.sample.sample_code + ' · ' + (a.sample.variety || '—')"></strong>
            <span x-text="' — ' + a.message"></span>
          </div>
        </a>
      </template>
    </section>

    <section style="margin-bottom:1.5rem;">
      <input class="field" type="search" placeholder="Поиск по коду образца, сорту, году…" x-model="query">
    </section>

    <section>
      <h2 style="margin: 0 0 0.75rem;">Последние анализы</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Образец</th>
              <th>Сорт</th>
              <th class="num">pH</th>
              <th class="num">Своб. SO₂</th>
              <th class="num">Мол. SO₂</th>
              <th class="num">VA</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="loaded && filteredRows.length === 0">
              <tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding: 2rem;">
                <span x-show="rows.length === 0">Анализов пока нет. Нажмите «Новый анализ», чтобы добавить первый.</span>
                <span x-show="rows.length > 0">Ничего не найдено по запросу.</span>
              </td></tr>
            </template>
            <template x-for="r in filteredRows" :key="r.id">
              <tr @click="goSample(r.sample.id)" style="cursor:pointer;">
                <td x-text="fmtDate(r.analyzed_at)"></td>
                <td><strong x-text="r.sample.sample_code"></strong></td>
                <td x-text="r.sample.variety + ' ' + (r.sample.vintage || '')"></td>
                <td class="num" x-text="r.ph?.toFixed(2) ?? '—'"></td>
                <td class="num" x-text="r.free_so2?.toFixed(0) ?? '—'"></td>
                <td class="num"
                    :class="molClass(r)"
                    x-text="r.molecular_so2?.toFixed(2) ?? '—'"
                    style="padding-left:0.5rem; padding-right:0.5rem;"></td>
                <td class="num"
                    :class="vaClass(r)"
                    x-text="r.volatile_acidity?.toFixed(2) ?? '—'"
                    style="padding-left:0.5rem; padding-right:0.5rem;"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="js/so2-logic.js"></script>
  <script src="js/analyses.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function dashboard() {
      return {
        loaded: false,
        rows: [],
        alerts: [],
        wineryName: '',
        query: '',

        get filteredRows() {
          const q = this.query.trim().toLowerCase();
          if (!q) return this.rows;
          return this.rows.filter(r => {
            const s = r.sample || {};
            return (s.sample_code || '').toLowerCase().includes(q)
                || (s.variety || '').toLowerCase().includes(q)
                || String(s.vintage || '').includes(q);
          });
        },
        async load() {
          await requireAuth();
          const winery = await getCurrentWinery();
          this.wineryName = winery ? winery.name : '';
          this.rows   = await listRecentAnalyses(10);
          this.alerts = await getAlerts();
          this.loaded = true;
          this.$nextTick(() => window.lucide?.createIcons());
        },
        goSample(id) { location.href = 'sample.html?id=' + encodeURIComponent(id); },
        fmtDate(s) { return new Date(s).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' }); },
        molClass(r) {
          if (r.molecular_so2 == null) return '';
          const st = window.SO2?.status(r.molecular_so2, r.sample?.wine_type);
          return st === 'ok' ? 'value-ok' : st === 'warn' ? 'value-warn' : st === 'bad' ? 'value-bad' : '';
        },
        vaClass(r) {
          const st = window.SO2?.vaStatus(r.volatile_acidity);
          return st === 'ok' ? '' : st === 'warn' ? 'value-warn' : st === 'bad' ? 'value-bad' : '';
        },
      };
    }
  </script>
</body>
</html>
